# SOC Detection Lab — Local/Production Compose Stack
#
# Usage:
#   docker compose up -d          # start full stack with HTTPS via nginx
#   docker compose logs -f app    # follow application logs
#
# HTTPS: https://localhost (self-signed cert — accept browser warning in dev)
# HTTP:  http://localhost  (auto-redirects to HTTPS)

services:
  # ── Nginx — HTTPS reverse proxy ──────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: soc-lab-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certs/server.crt:/etc/nginx/certs/server.crt:ro
      - ./infra/certs/server.key:/etc/nginx/certs/server.key:ro
    depends_on:
      - app
    restart: unless-stopped

  # ── App ───────────────────────────────────────────────────────────────────────
  app:
    build: .
    container_name: soc-lab-app
    expose:
      - '3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-900}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-soc}:${POSTGRES_PASSWORD:-soc}@postgres:5432/${POSTGRES_DB:-soclab}
      REDIS_URL: redis://redis:6379
      SERVE_STATIC: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: soc-lab-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc}
      POSTGRES_DB: ${POSTGRES_DB:-soclab}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-soc} -d ${POSTGRES_DB:-soclab}']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: soc-lab-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
