name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Lint backend
        run: npm run lint

      - name: Type-check backend
        run: npx tsc --project tsconfig.backend.json --noEmit

      - name: Unit tests
        run: npx jest --config jest.config.unit.js --coverage=false

      - name: Integration tests
        run: npx jest --config jest.config.integration.js

      - name: Install frontend dependencies
        working-directory: src/frontend
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Lint frontend
        working-directory: src/frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: src/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: src/frontend
        run: npm run build

      - name: Backend build
        run: npx tsc --project tsconfig.backend.json

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: soc-detection-lab:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
